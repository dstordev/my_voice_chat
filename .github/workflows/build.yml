name: Build Multiplatform Binaries

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my_voice_chat_linux
            binary_path: target/x86_64-unknown-linux-gnu/release/my_voice_chat

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my_voice_chat_windows
            binary_path: target/x86_64-pc-windows-msvc/release/my_voice_chat.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: my_voice_chat_mac
            binary_path: target/release/my_voice_chat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install opus pkg-config autoconf automake libtool

      - name: Build release binary (Linux & Windows)
        if: matrix.os != 'macos-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

      # Переименовываем бинарник перед загрузкой в релиз, чтобы имена не конфликтовали
      - name: Prepare binary name for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ${{ matrix.binary_path }} ./${{ matrix.artifact_name }}.exe
          else
            cp ${{ matrix.binary_path }} ./${{ matrix.artifact_name }}
          fi

      # Публикуем готовый файл в раздел Releases
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            my_voice_chat_linux
            my_voice_chat_windows.exe
            my_voice_chat_mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
