name: Build Multiplatform Binaries

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my_voice_chat_linux
            binary_path: target/x86_64-unknown-linux-gnu/release/my_voice_chat

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my_voice_chat_windows
            binary_path: target/x86_64-pc-windows-msvc/release/my_voice_chat.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: my_voice_chat_mac
            binary_path: target/aarch64-apple-darwin/release/my_voice_chat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
